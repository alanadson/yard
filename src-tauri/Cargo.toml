[package]
name = "yard"
version = "0.1.0"
description = "Code agent orchestrator for Windows"
authors = ["Yard"]
edition = "2021"
license = "Apache-2.0"

[lib]
# The `_lib` suffix avoids a name clash with the Windows binary.
name = "yard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon`: the notification-area icon (tray.rs) is a feature of the
# core crate, not a plugin.
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# Signed in-app updates from GitHub Releases (updater.rs) and the restart the
# updater asks for after installing (`process`).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# The summon hotkey that works with the window hidden or behind (tray.rs).
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
which = "7"
sysinfo = "0.32"
notify = "7"
notify-debouncer-mini = "0.5"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
anyhow = "1"
parking_lot = "0.12"
# Agent<->app bridge: named-pipe server (bridge.rs). Tauri already brings
# tokio; here we only enable the features the pipe needs.
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt"] }
# Agent usage limits (usage.rs): three GETs a minute on a background thread —
# a small blocking client does the job without dragging in reqwest.
ureq = "2"
# Installed-font scan (fonts.rs): family name, monospaced flag and whether the
# GSUB table carries ligatures — the preferences panel offers real choices
# instead of a free-text field.
ttf-parser = "0.25"
# Project search (explorer.rs): the regex mode of Ctrl+Shift+F, and the engine
# behind the literal mode too, one matcher means the search and the replace
# cannot disagree about what matched.
regex = "1"
# Portal screenshots (portal.rs): the files exist to be opened by agents, and
# PNG is what agent APIs accept — the old BMPs could not be attached at all.
png = "0.17"
# MCP manager (mcp.rs): Codex keeps its servers in `~/.codex/config.toml`, and
# editing that file must keep the user's comments and layout — toml_edit works
# on the document, not on a value tree. The other CLIs use JSON (serde_json).
toml_edit = "0.25"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  # CreateJobObjectW takes *const SECURITY_ATTRIBUTES: without this feature
  # the function does not even exist in the crate.
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  # Keep-awake (power.rs): SetThreadExecutionState lives here.
  "Win32_System_Power",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.dev]
# a panic in a command becomes Err instead of taking the app down during HMR
panic = "unwind"

# One release profile, used by the launcher (scripts/yard.ps1) and by the
# installer alike. There used to be a second, `release-fast`, for the everyday
# rebuild — but a second profile is a second `target/` tree: ~600 dependencies
# compiled and kept twice, 2.4 GB of disk, and a full rebuild every time you
# moved from `npm run app` to `npm run app:installer`.
#
# So `release` itself was made quick instead. Measured on this machine (16
# cores), rebuilding after one changed line with every dependency compiled:
#
#   lto = true,   codegen-units = 1,  opt-level = "s"   5m 07s
#   lto = "thin", codegen-units = 16, opt-level = 2     2m 01s
#   lto = false,  codegen-units = 16, opt-level = 2       35s   <- this profile
#
# Nearly all of the old cost was one step: LTO over the whole 611-crate graph
# on every link. Cross-crate LTO is worth having in what ships and worth
# nothing on a machine where you rebuild twenty times an hour — so the release
# workflow turns it back on with `CARGO_PROFILE_RELEASE_LTO=thin` (see
# .github/workflows/release.yml), and here it stays off. The binary a developer
# runs is ~27 MB instead of ~22 MB; the one that ships is unaffected.
[profile.release]
panic = "abort"
lto = false
codegen-units = 16
opt-level = 2
strip = true
# The one thing the local loop really wants: only the parts of `yard` that
# actually changed get codegen'd again.
incremental = true
