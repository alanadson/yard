[package]
name = "yard"
version = "0.1.0"
description = "Code agent orchestrator for Windows"
authors = ["Yard"]
edition = "2021"
license = "Apache-2.0"

[lib]
# The `_lib` suffix avoids a name clash with the Windows binary.
name = "yard_lib"
# Only `rlib`: the binary in main.rs links the library the ordinary way. The
# Tauri template also lists `staticlib` and `cdylib`, which exist for the
# mobile targets this app does not have. Here they were not free: every
# rebuild of yard_lib archived the whole dependency graph into a 1.4 GB
# `yard_lib.lib` and linked a `yard_lib.dll` nothing loads, about 8 s of the
# dev loop and 138 MB more in every release build.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon`: the notification-area icon (tray.rs) is a feature of the
# core crate, not a plugin.
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# Signed in-app updates from GitHub Releases (updater.rs) and the restart the
# updater asks for after installing (`process`).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# The summon hotkey that works with the window hidden or behind (tray.rs).
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
which = "7"
# Process tree and RAM readings (process_tree.rs) and the OS name in support
# bundles (support.rs) live in the `system` feature. The defaults also compile
# disks, networks, components (WMI) and users, which nothing here reads, so
# those stay off. `multithread` stays on, on purpose: the process refresh
# (`ProcSnapshot::refresh_if_stale`, every 2 s from resources.rs) runs while
# `state.procs` is locked, and the RAM gate on every agent spawn
# (`pty::wait_for_memory`) and the no-job kill fallback wait on that same lock.
# On one thread the scan takes ~35 ms on an idle machine and hundreds of ms,
# sometimes seconds, under full CPU load (agents building in the terminals);
# on the rayon pool it stays around 20 to 70 ms. The few ms of CPU a
# single-threaded scan saves per tick are not worth a slower agent spawn.
sysinfo = { version = "0.32", default-features = false, features = ["system", "multithread"] }
notify = "7"
notify-debouncer-mini = "0.5"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
anyhow = "1"
parking_lot = "0.12"
# Agent<->app bridge: named-pipe server (bridge.rs). Tauri already brings
# tokio; here we only enable the features the pipe needs.
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt"] }
# Agent usage limits (usage.rs): three GETs a minute on a background thread —
# a small blocking client does the job without dragging in reqwest.
ureq = "2"
# Installed-font scan (fonts.rs): family name, monospaced flag and whether the
# GSUB table carries ligatures — the preferences panel offers real choices
# instead of a free-text field.
ttf-parser = "0.25"
# Project search (explorer.rs): the regex mode of Ctrl+Shift+F, and the engine
# behind the literal mode too, one matcher means the search and the replace
# cannot disagree about what matched.
regex = "1"
# Portal screenshots (portal.rs): the files exist to be opened by agents, and
# PNG is what agent APIs accept — the old BMPs could not be attached at all.
png = "0.17"
# MCP manager (mcp.rs): Codex keeps its servers in `~/.codex/config.toml`, and
# editing that file must keep the user's comments and layout — toml_edit works
# on the document, not on a value tree. The other CLIs use JSON (serde_json).
toml_edit = "0.25"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  # CreateJobObjectW takes *const SECURITY_ATTRIBUTES: without this feature
  # the function does not even exist in the crate.
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  # Keep-awake (power.rs): SetThreadExecutionState lives here.
  "Win32_System_Power",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.dev]
# a panic in a command becomes Err instead of taking the app down during HMR
panic = "unwind"
# File and line in every backtrace, but no variable info: with the full
# debuginfo this 42k-line crate spent most of its codegen describing types,
# and the linker most of its time merging a 276 MB PDB. Measured on a
# 16-core machine, `tauri dev` rebuild after one changed line: 14 to 19 s
# before, 7 to 8 s with this, the `rlib`-only crate type above and the
# dependency setting below. Put `debug = 2` back here to step through
# yard_lib in a debugger; the dependencies stay without.
debug = "line-tables-only"

# No debuginfo for the ~540 dependencies: the PDB drops from 276 MB to 70 MB
# and the final link from 4 to 8 s to under 2 s. Stepping into dependency
# code in a debugger is what this gives up.
[profile.dev.package."*"]
debug = false

# One release profile, used by the launcher (scripts/yard.ps1) and by the
# installer alike. There used to be a second, `release-fast`, for the everyday
# rebuild — but a second profile is a second `target/` tree: ~600 dependencies
# compiled and kept twice, 2.4 GB of disk, and a full rebuild every time you
# moved from `npm run app` to `npm run app:installer`.
#
# So `release` itself was made quick instead. Measured on this machine (16
# cores), rebuilding after one changed line with every dependency compiled:
#
#   lto = true,   codegen-units = 1,  opt-level = "s"   5m 07s
#   lto = "thin", codegen-units = 16, opt-level = 2     2m 01s
#   lto = false,  codegen-units = 16, opt-level = 2       35s   <- this profile
#
# Nearly all of the old cost was one step: LTO over the whole 611-crate graph
# on every link. Cross-crate LTO and a single codegen unit are worth having in
# what ships and worth nothing on a machine where you rebuild twenty times an
# hour, so the release workflow turns them back on with
# `CARGO_PROFILE_RELEASE_LTO=thin` and `CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1`
# (see .github/workflows/release.yml), and here they stay off. `opt-level` is 2
# in both. The binary a developer runs is ~27 MB, against ~22 MB for the old
# fat-LTO, size-optimized profile.
[profile.release]
panic = "abort"
lto = false
codegen-units = 16
opt-level = 2
strip = true
# The one thing the local loop really wants: only the parts of `yard` that
# actually changed get codegen'd again.
incremental = true
