<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Yard</title>
    <!--
      The ground, painted before any sheet arrives, so the window never opens
      as a white slab. It used to be `style="background: #131316"` on the
      <body> — which worked, and then went on outranking every stylesheet
      forever: an inline declaration beats an author rule, so the light
      appearance kept compositing its translucent materials over a black
      floor and came out as grey mud. Here it is a rule like any other, on
      <html> instead of <body>, so `body { background: var(--ambient) }`
      still wins the moment styles.css lands.

      Two cases, in the order they resolve: the OS preference — all this file
      can know — and then the attribute `lib/theme.ts` stamps, which
      `restoreTheme` puts back from the last session at the top of `main.tsx`,
      so a light user does not watch the shell flash dark on every launch.
      That restore lives in the module and not in an inline <script> here on
      purpose: the production CSP is `script-src 'self'` (tauri.conf.json) and
      would refuse it.

      This block costs something, and it is not obvious: in a packaged build
      Tauri stamps a nonce on every <style> it finds here and adds it to
      `style-src`, which makes the browser ignore the `'unsafe-inline'` next
      to it — and CodeMirror, whose entire stylesheet is written by JS at
      runtime, opens with no CSS at all. `tauri.conf.json` pays for it with
      `dangerousDisableAssetCspModification: ["style-src"]`; the whole chain
      is in `src/lib/csp.ts` and `src/lib/csp.test.ts` holds it.
    -->
    <style>
      html { background: #000000; }
      @media (prefers-color-scheme: light) { html { background: #eceef3; } }
      html[data-theme="light"] { background: #eceef3; }
      html[data-theme="dark"] { background: #000000; }
    </style>
  </head>
  <body>
    <!--
      impeccable:direction-contract
      THESIS: an agent orchestrator that looks like a premium desktop
      instrument — instrument windows over a deep ambient ground; it refuses
      the category's default arrangement (flat gray "dark terminal" chrome).
      OWN-WORLD: translucent blurred materials (vibrancy) on floating
      surfaces, hairlines of light, system blue (#0A84FF) as the only action
      color, generous radii (9/14/20), deep soft shadows, Inter as the SF-like
      face, semantic chroma green/yellow/red only for state and diffs. The one
      concession to the host OS: Windows window controls, top right.
      STORY: the user opens it and understands — projects on the left,
      terminals as mini windows in the center, everything responds with short
      precise physics; the agents work, the chrome recedes.
      FIRST VIEWPORT: title bar with breadcrumb + segmented control + window
      controls; vibrancy sidebar; grid of window-panels over the ambient
      ground; single blue primary action ("Terminal" / "Adicionar projeto").
      FORM: pinned by the user ("premium modern, glass and mini windows",
      2026-08-13, full freedom on the rest) — no lottery; seed: none.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, and docs/DESIGN.md.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
