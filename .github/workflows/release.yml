name: release

# Tag a commit (`git tag v0.1.0 && git push origin v0.1.0`) and this builds the
# NSIS installer, signs the updater artifacts, writes `latest.json` and
# attaches everything to a draft GitHub release for review. Publishing the
# draft is what makes the running installs see the update (the app reads
# `releases/latest/download/latest.json` — see docs/development.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    # A thin-LTO, single-codegen-unit build plus the packaged-install check;
    # a run past this is hung, not slow.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.120.0  # keep in step with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Restore the cache ci.yml saves on main (same key) and never save
          # one from a tag: a release build would only evict main's entry.
          shared-key: yard-windows
          save-if: false
      - run: npm ci
      # Typecheck, tests, audit, clippy and cargo test. The front-end build is
      # not in it: tauri-action runs `beforeBuildCommand` (`npm run build`).
      - name: Validate before building release artifacts
        run: npm run validate:release

      # Windows code signing — only when the repository carries a certificate.
      # `secrets.*` cannot be tested in `if:` directly, so the presence check
      # goes through an env var. With no certificate the step writes an empty
      # `args` output and the build runs unsigned, exactly as before; the day
      # a certificate exists, nothing but the two secrets changes.
      - name: Import the code-signing certificate
        id: cert
        shell: pwsh
        env:
          HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ($env:HAS_CERT -ne 'true') {
            Write-Output "no certificate secret: building unsigned"
            "args=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          $certificateFile = Join-Path $env:RUNNER_TEMP "yard-signing-$([Guid]::NewGuid().ToString('N')).pfx"
          [IO.File]::WriteAllBytes($certificateFile, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          try {
            $cert = @(Import-PfxCertificate -FilePath $certificateFile -CertStoreLocation Cert:\CurrentUser\My `
              -Password (ConvertTo-SecureString -String $env:WINDOWS_CERT_PASSWORD -Force -AsPlainText))
          } finally { Remove-Item -LiteralPath $certificateFile -Force }
          . ./scripts/signing-certificate.ps1
          $records = @(Get-ReleaseCertificateMetadata -Certificates $cert)
          $metadataPath = Join-Path $env:RUNNER_TEMP "signing-metadata.json"
          ConvertTo-Json -InputObject $records -Depth 5 -Compress | Set-Content -LiteralPath $metadataPath -Encoding utf8
          $thumbprint = node scripts/signing-certificate.mjs $metadataPath
          if ($LASTEXITCODE -ne 0) { throw "The imported signing certificate failed release validation." }
          $override = @{ bundle = @{ windows = @{
            certificateThumbprint = $thumbprint.Trim()
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          } } } | ConvertTo-Json -Depth 5 -Compress
          $path = Join-Path $env:RUNNER_TEMP "signing.json"
          Set-Content -Path $path -Value $override -Encoding utf8
          "args=--config `"$path`"" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "certificate validated: $($thumbprint.Trim())"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `[profile.release]` in Cargo.toml has cross-crate LTO off and
          # incremental on: that profile is what a developer rebuilds twenty
          # times an hour, and LTO over 611 crates cost minutes of every one of
          # them. What ships is built once, by a machine, so here the trade goes
          # the other way.
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_INCREMENTAL: "false"
          # The same trade for codegen units: the local profile splits each
          # crate into 16 so a rebuild codegens in parallel, and that split
          # hides code from the optimizer (fewer inlining chances across the
          # pieces). One unit makes only this tag build slower; the local 35 s
          # loop never sees this variable. `opt-level` stays at the profile's
          # 2: this line changes how each crate is split for codegen, not how
          # hard each piece is optimized.
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          # The updater's minisign key (`npx tauri signer generate`). Without
          # it `createUpdaterArtifacts` fails the build on purpose: an
          # unsigned installer can never become an update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Yard ${{ github.ref_name }}"
          releaseBody: "See the assets below. Windows 10/11, x64."
          releaseDraft: true
          prerelease: false
          # `latest.json` next to the installer: the app's updater endpoint.
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ steps.cert.outputs.args }}
      - name: Verify packaged installation and replacement with preserved legacy data
        timeout-minutes: 10
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $current = @(Get-ChildItem -LiteralPath src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if ($current.Count -ne 1) { throw 'Expected exactly one current installer artifact.' }
          $baselineTag = & gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>&1
          if ($LASTEXITCODE -eq 0) {
            $baselineDirectory = Join-Path $env:RUNNER_TEMP 'yard-previous-release'
            & gh release download $baselineTag --repo $env:GITHUB_REPOSITORY --pattern '*-setup.exe' --dir $baselineDirectory
            if ($LASTEXITCODE -ne 0) { throw 'Could not download the previous installer baseline.' }
            $previous = @(Get-ChildItem -LiteralPath $baselineDirectory -Filter '*-setup.exe')
            if ($previous.Count -ne 1) { throw 'Expected exactly one published installer baseline.' }
            node scripts/packaged-install.mjs ($current[0].FullName) ($previous[0].FullName)
          } elseif (($baselineTag | Out-String) -match 'HTTP 404') {
            Write-Output 'No published baseline exists: verifying installation and same-package replacement.'
            node scripts/packaged-install.mjs ($current[0].FullName)
          } else {
            throw 'Could not inspect the published installer baseline.'
          }
          if ($LASTEXITCODE -ne 0) { throw 'Packaged installer verification failed.' }
